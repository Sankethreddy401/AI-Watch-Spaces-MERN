services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
  server:
    build: ./server
    restart: unless-stopped
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/ai_watch_spaces
      JWT_SECRET: ${JWT_SECRET:-local_dev_change_me_please}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-local_refresh_change_me_please}
      CLIENT_URL: http://localhost:5173
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
  client:
    build: ./client
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - server
volumes:
  mongo_data:
